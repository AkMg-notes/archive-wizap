<h1>フィアナ紹介</h1>
<p class="updated">Date:2002.7.30</p>

<dl>
 <dt>発生時期</dt>
 <dd>2-3,2-5</dd>
 <dt>発生条件</dt>
 <dd>
  <ul>
   <li>パーティが二人以下であること</li>
   <li>主人公がFW以外であること</li>
  </ul>
 </dd>
 <dt>発生に必要な手順</dt>
 <dd>ゴードンから話を聞く</dd>
</dl>

<h2>概観</h2>
<p>ゴードンの話の後、フィアナが仲間に加わる。選択肢は出ない。</p>

<h2>メモ</h2>
<p>2-4でもフィアナはいるのだが、どうやらゴードンの方が そのことを忘れているようだ。</p>
